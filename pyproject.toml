[project]
name = "jinrong-trusted-rag"
version = "0.1.0"
description = "Trusted RAG MVP for banking regulatory documents and statistical tables."
requires-python = ">=3.10"
dependencies = [
  "openpyxl",
  "pandas",
  "python-docx",
  "pdfplumber",
  "xlrd",
  "fastapi",
  "uvicorn",
]

[project.scripts]
jinrong = "jinrong.cli:main"

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "uv==0.8.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
